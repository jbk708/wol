name: python

# Runs the test suites for the analysis code under code/.
# The website build is handled separately by site.yml.

on:
  push:
    paths:
      - 'code/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'code/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v

      - name: Check every script at least parses
        run: |
          uv run --python ${{ matrix.python-version }} python - <<'PY'
          import pathlib, py_compile, sys
          bad = []
          for f in sorted(pathlib.Path("code").rglob("*.py")):
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  bad.append(f"{f}: {e.msg.strip()}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"All {len(list(pathlib.Path('code').rglob('*.py')))} scripts compile.")
          PY
