server {
    listen 8080;
    server_name www.weboflife3.org;
    return 301 https://weboflife3.org$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # cloudflared talks to us over plain http on a loopback port; keep redirects relative so
    # nginx never sends browsers to http://host:8080/.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # GitHub Pages serves /start from start.html and /data/genomes from its README-derived index.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
