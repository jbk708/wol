# theme: Minimal Mistakes
remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: default
plugins:
  - jekyll-include-cache
  - jekyll-optional-front-matter
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-sitemap

# directories
# Only the dirs that actually exist are overridden; layouts, sass and plugins
# come from the remote theme.
data_dir: pages/data
includes_dir: pages/includes

# Template internals live under pages/ (which is not underscore-prefixed, so
# Jekyll would otherwise copy them verbatim into the built site).
exclude:
  - pages/data
  - pages/includes
  - Gemfile
  - Gemfile.lock
  - pyproject.toml
  - uv.lock
  - code/**/.pytest_cache

# metadata
title: WoL
# subtitle: Ver 1.0
name: WoL development team
description: A Reference Phylogeny for 10,575 Bacterial and Archaeal Genomes
url: https://biocore.github.io/wol/
repository: biocore/wol
logo: ../gallery/logo/logo_s_b.png
locale: en-US

# features:
# search: true
permalink: none

# default
defaults:
  - scope:
      path: ''
      type: pages
    values:
      title: ''
      # author_profile: true
      layout: single
      # toc: true
      # toc_sticky: true
      classes: wide
      sidebar:
         nav: top
      # comments: true
      share: true
      # related: true

# footer
footer:
  links:
    - label: License
      icon: fas fa-fw fa-certificate
      url: /LICENSE
      description: 'BSD 3-Clause'
    - label: Citation
      icon: fas fa-fw fa-book
      url: https://www.nature.com/articles/s41467-019-13443-4
      description: 'Zhu Q, Mai U, Pfeiffer W, Janssen S, Asnicar F, et al. Nat Commun. 2019. 10(1):5477.'
    - label: Grants
      icon: fas fa-fw fa-dollar-sign
      url: /start#grants
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/biocore/wol
      description: 'biocore/wol'
    - label: Twitter
      icon: fab fa-fw fa-twitter
      url: https://twitter.com/KnightLabNews
      description: '@KnightLabNews'
    - label: Contact
      icon: fas fa-fw fa-envelope
      url: mailto:Qiyun.Zhu@asu.edu
      description: 'Dr. Qiyun Zhu: Qiyun.Zhu@asu.edu, Dr. Rob Knight: robknight@ucsd.edu'
